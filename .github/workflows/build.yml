name: Build IslandButterfly

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      # 无签名编译：产物是没有签名的 .app，后续用 SideStore / AltStore 自签安装。
      # -scheme 需要共享 scheme 文件（IslandButterfly.xcodeproj/xcshareddata/xcschemes/）。
      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project IslandButterfly.xcodeproj \
            -scheme IslandButterfly \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R "build/Build/Products/Release-iphoneos/IslandButterfly.app" Payload/
          zip -r IslandButterfly.ipa Payload
          ls -lh IslandButterfly.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: IslandButterfly-unsigned-ipa
          path: IslandButterfly.ipa
          if-no-files-found: error
